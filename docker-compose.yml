# Earth Information Jukebox - Docker Compose Orchestration
# Combines webapp, backend, and data services
#
# Usage:
#   cp .env.example .env          # Configure environment
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services

services:
  # ─────────────────────────────────────────────────────────────
  # Data initialization: populates volume with pre-processed datasets
  # Runs at each `up`, exits, and is a dependency for backend
  # ─────────────────────────────────────────────────────────────
  data-init:
    image: ghcr.io/the-earth-information-jukebox-heig-vd/datasets:${DATASETS_VERSION:-${DATA_TAG:-latest}}
    volumes:
      - jukebox-data:/data
    # Copies the data when the volume is empty OR holds another image's data:
    # .initialized stores a fingerprint of /datasets (file list, sizes, dates),
    # so changing DATASETS_VERSION (or pulling a rebuilt :latest) refreshes it.
    # The volume is emptied first so files removed/renamed upstream disappear.
    command:
      - sh
      - -ec
      - |
        new=$$(ls -lR /datasets | md5sum | cut -d' ' -f1)
        if [ "$$(cat /data/.initialized 2>/dev/null)" = "$$new" ]; then
          echo 'Data already up to date, skipping'
        else
          echo 'Initializing data volume...'
          find /data -mindepth 1 -delete
          cp -r /datasets/. /data/
          echo "$$new" > /data/.initialized
          echo 'Data initialized successfully'
        fi
    restart: "no"
    networks:
      - jukebox-net

  # ─────────────────────────────────────────────────────────────
  # Backend: FastAPI sonification service
  # Transforms climate data into orchestral music (MIDI + audio)
  # ─────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/the-earth-information-jukebox-heig-vd/sonification:${SONIFICATION_VERSION:-${TAG:-latest}}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - JUKEBOX_DATA_DIR=/app/data
      - JUKEBOX_CACHE_DIR=/app/cache
      - JUKEBOX_CORS=${JUKEBOX_CORS:-*}
    volumes:
      - jukebox-data:/app/data:ro
      - jukebox-cache:/app/cache
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - jukebox-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # Webapp: React frontend served by Nginx
  # Proxies /api/* requests to the backend service
  # Serves the datasets volume read-only at /data/ (globe visuals)
  # ─────────────────────────────────────────────────────────────
  webapp:
    image: ghcr.io/the-earth-information-jukebox-heig-vd/webapp:${WEBAPP_VERSION:-${TAG:-latest}}
    ports:
      - "${WEBAPP_PORT:-80}:80"
    volumes:
      - jukebox-data:/usr/share/nginx/data:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jukebox-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# ─────────────────────────────────────────────────────────────
# Named volumes for data persistence
# ─────────────────────────────────────────────────────────────
volumes:
  jukebox-data:
    name: jukebox-data
  jukebox-cache:
    name: jukebox-cache

# ─────────────────────────────────────────────────────────────
# Internal network for service communication
# ─────────────────────────────────────────────────────────────
networks:
  jukebox-net:
    driver: bridge
